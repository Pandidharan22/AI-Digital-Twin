[project]
name = "voice-twin"
version = "0.1.0"
description = "Cited real-time voice agent grounded in a curated document corpus, built with LiveKit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "livekit-agents>=1.6.10",
    "livekit-plugins-deepgram>=1.6.10",
    "livekit-plugins-google>=1.6.10",
    "livekit-plugins-silero>=1.6.10",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "slowapi>=0.1.10",
    "supabase>=2.31.0",
    "tiktoken>=0.14.0",
    "torch>=2.2",
    "uvicorn[standard]>=0.38.0",
]

# torch is a transitive dependency of sentence-transformers, used here only
# for local CPU inference of bge-small-en-v1.5 (384 dims -- see CLAUDE.md's
# stack table). Without this, `uv sync` on Linux resolves PyPI's default
# CUDA-enabled torch wheel and its full nvidia-* dependency chain
# (nvidia-cublas, nvidia-cudnn, nvidia-cusolver, etc. -- 2.5GB+ combined,
# confirmed live while building agent/Dockerfile, 2026-08-21), none of which
# this project ever uses or has a GPU to run. Pinning to PyTorch's own
# CPU-only index applies to every platform uv resolves for, including local
# Windows dev (unaffected in practice -- Windows already resolved a CPU-only
# wheel from the default index).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: hits the real, live Supabase corpus (embeds locally, real network call) -- needs DATABASE_URL/SUPABASE_* in .env. Skip with -m \"not integration\" for a fast, infra-free run.",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
