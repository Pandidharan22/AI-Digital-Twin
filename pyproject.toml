[project]
name = "voice-twin"
version = "0.1.0"
description = "Cited real-time voice agent grounded in a curated document corpus, built with LiveKit"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents>=1.6.10",
    "livekit-plugins-deepgram>=1.6.10",
    "livekit-plugins-google>=1.6.10",
    "livekit-plugins-silero>=1.6.10",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "supabase>=2.31.0",
    "tiktoken>=0.14.0",
]
