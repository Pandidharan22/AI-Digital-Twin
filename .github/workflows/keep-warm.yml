name: Keep token API warm

# Render's free tier sleeps a web service after ~15 min with no inbound
# traffic; the first request after that pays a 10-30s cold start, which a
# real visitor reads as "broken", not "loading" (docs/DEPLOYMENT.md Sec4).
# Pinging /health every 10 minutes keeps it inside that window with a
# comfortable margin, since GitHub Actions' own schedule trigger doesn't
# fire at exact wall-clock times under load.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping token API health endpoint
        run: |
          curl -fsS --max-time 30 https://voice-twin-api-46lk.onrender.com/health
