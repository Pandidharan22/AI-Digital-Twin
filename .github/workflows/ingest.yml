name: Refresh corpus from GitHub

# Keeps the GitHub-sourced portion of the corpus fresh (README content for
# the six curated repos in ingestion/loaders/github_loader.py) -- per
# docs/DATA_INGESTION.md Sec8's own recommendation: GitHub Actions,
# schedule cron, daily.
#
# corpus/*.pdf and corpus/context.md are deliberately gitignored (the
# Phase 2 privacy decision -- they carry a phone number and email) and so
# are never checked out here. That's safe by design, not a workaround:
# ingestion/ingest.py's run() only deletes stale rows for sources it
# actually produced *this run* (keyed by ingestion/loaders' own r.source
# values), so with the resume/context.md files absent, those two sources
# never appear in that set and their rows in Supabase are left completely
# untouched -- confirmed with a read-only dry run (_load_all() called
# directly, no DB write) before this workflow was written, not assumed.
# See docs/DEV_JOURNAL.md's 2026-08-23 entry.
#
# Runs ingestion/validate.py afterward, per docs/DATA_INGESTION.md Sec9 --
# a bad refresh should fail this job loudly (GitHub emails the repo owner
# on workflow failure by default) rather than silently degrade retrieval.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # GitHub Actions reserves the secret name GITHUB_TOKEN for its own
      # auto-generated, repo-scoped token, so the real fine-grained PAT
      # ingestion/loaders/github_loader.py needs is stored under a
      # different secret name and mapped to the env var name the code
      # actually reads.
      GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_PAT }}
      GITHUB_USERNAME: Pandidharan22
      # Not secrets -- the same tuned values agent/config.py reads from
      # .env in every other environment. Without these, ingestion/
      # validate.py silently falls back to its own stale built-in default
      # (0.35), which lets out-of-scope queries match and fails the
      # out-of-scope spot check -- confirmed live 2026-08-23 against this
      # exact workflow, not a hypothetical.
      RETRIEVAL_THRESHOLD: "0.55"
      RETRIEVAL_TOP_K: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ingestion
        run: uv run python -m ingestion.ingest

      - name: Validate corpus
        run: uv run python -m ingestion.validate
